name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tock
          POSTGRES_PASSWORD: tock
          POSTGRES_DB: tock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tock -d tock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -tags integration ./...
        env:
          DATABASE_URL: postgres://tock:tock@localhost:5432/tock?sslmode=disable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tock:ci .

  image:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: vX.Y.Z (got: ${tag})"
            exit 1
          fi
          git tag -f "$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ghcr.io/rejisterjack/tock:${{ env.RELEASE_TAG }}
            ghcr.io/rejisterjack/tock:latest
