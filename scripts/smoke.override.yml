# Used by scripts/smoke.py. Replaces the published ports so the smoke stack
# can run while another service already owns 8080, and points SMTP at Mailpit.
services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      TOCK_BASE_URL: http://127.0.0.1:18080
      TOCK_DEMO: "false"
      TOCK_TRUST_PROXY: "false"
      TOCK_SMTP_HOST: mailpit
      TOCK_SMTP_PORT: "1025"
      TOCK_SMTP_FROM: tock@localhost
      TOCK_SMTP_USER: ""
      TOCK_SMTP_PASSWORD: ""
  mailpit:
    ports: !override
      - "127.0.0.1:18025:8025"
