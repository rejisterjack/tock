services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tock
      POSTGRES_PASSWORD: tock
      POSTGRES_DB: tock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tock -d tock"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://tock:tock@postgres:5432/tock?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/tock", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    profiles: ["smtp"]
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  pgdata:
